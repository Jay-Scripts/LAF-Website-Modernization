            - paragraph [ref=f6e63]: GMA Network deeply values creativity and regards employees as its greatest assets. We continuously encourage our fellow Kapuso to explore and discover their unique gifts, understanding that by doing so, they not only enrich their own lives but also elevate the lives of those around them.
            - paragraph [ref=f6e64]: For nearly a quarter of a century, GMA Network’s Art Gap has served as a platform showcasing the creativity of our Kapuso employees and artists. What began as a modest painting exhibit in 2001 has blossomed into an annual event that embraces a wide range of artistic media, including painting, photography, songwriting, video production, fashion, and sustainable design.
            - generic [ref=f6e65]: The GMA Network initiative 'Art Gap Gives Back' brings together 30 pediatric patients for an afternoon of art therapy, a practice highly regarded by pediatric oncologists.
            - paragraph [ref=f6e68]: As we approach GMA Network’s 75th anniversary, we launched “Art Gap Gives Back,” an initiative born of our desire to integrate artistic expression with social responsibility. We partnered with the National Children’s Hospital and The Little Ark Foundation, focusing our efforts on supporting pediatric patients battling leukemia and thalassemia. Little Ark, which was initiated by a former GMA employee whose son bravely overcame leukemia following a bone marrow transplant, provides crucial support including housing, transportation, meals, and therapeutic activities to children under the age of 19.
            - generic [ref=f6e69]: Art therapy is a psychological tool that allows young patients to process and express their emotions in a healing environment.
            - paragraph [ref=f6e72]: The initiative brought together 30 pediatric patients for an afternoon of art therapy — a practice highly regarded by pediatric oncologists as a psychological tool that allows young patients to process and express their emotions in a healing environment.
            - generic [ref=f6e73]: Beauty queen and host Shuvee Etrata helps one of the kids with her artwork.
            - paragraph [ref=f6e76]: “This is the first time GMA has partnered with the National Children’s Hospital and the Little Ark Foundation. We’re very happy and fortunate to be part of it,” said Butch Bustamante, the founder of Little Ark.
            - generic [ref=f6e77]: "'Art Gap Gives Back' is launched as GMA approaches its 75th anniversary."
            - paragraph [ref=f6e80]: The event was powered by the incredible generosity of our Sparkle artists, who found unique ways to contribute. Beauty queen and host Shuvee Etrata said, “As artists, mayroon kaming platform to help other people, hindi lang naman financial din ‘yung tulong, bigyan natin sila ng kasiyahan. Now is the time to help.”
            - generic [ref=f6e81]: Little Ark foundation founder Butch Bustamante.
            - paragraph [ref=f6e84]: The spirit of giving was vibrantly alive as Kapuso actor and singer Kim Perez got the kids dancing with his songs. Another generous donor was Kapuso actress Zonia Mejia.
            - generic [ref=f6e85]: The event is powered by the incredible generosity of Sparkle artists Kim Perez and Shuvee Entrata. Kapuso actress Zonia Mejia is another generous donor.
            - paragraph [ref=f6e88]: Yet another thread that made it special was that our own employees volunteered. At GMA, we believe that our people possess a deep reservoir of creativity. We are dedicated to their holistic growth — professionally, personally, and as pillars of the community. From engineers to researchers, these individuals shared their expertise, led by Agatha Guidaben from GMA Integrated News Research, who taught the children valuable drawing techniques. Speaking with these devoted volunteers, it was clear how deeply Art Gap has influenced their lives.
            - generic [ref=f6e89]: "Raizen, a young boy battling acute lymphoblastic leukemia, paints a gavel, symbolizing his dreams to defend the weak, an aspiration insipired by 'Lilet Matias: Attorney-At-Law' star Jo Berry."
            - paragraph [ref=f6e92]: "The kids’ artworks were displayed at GMA Network, with proceeds going directly to the young artists. Among the masterpieces was a painting by Raizen, a young boy battling acute lymphoblastic leukemia. He painted a gavel, symbolizing his dream to defend the weak — an aspiration inspired by Kapuso actress Jo Berry and her role in the highly acclaimed series, “Lilet Matias: Attorney-At-Law.”"
            - generic [ref=f6e93]: Little Ark's Donasco with Agatha Guidaben from GMA Integrated News Research.
            - paragraph [ref=f6e96]: “Gusto ko po ipagtanggol po ‘yung hindi po nila kayang ipagtanggol, ‘yung sarili nila, doon po ako na-inspire sa kanya. Sabi ko kailangan talagang maging matapang kapag may pinaglalaban tayo,” Raizen shared.
            - paragraph [ref=f6e97]: Jo Berry responded with heartfelt gratitude, saying, “Ako rin, nadagdagan yung inspiration ko. Thank you na ganyan ‘yung willpower mo na ituloy ‘yung pangarap mo.”
            - generic [ref=f6e98]: "The cast of 'Lilet Matias: Attorney-At-Law' organizes a surprise birthday party for Raizen, creating a memory that will last a lifetime."
            - paragraph [ref=f6e101]: Adding a touch of joy to the event, the cast organized a surprise birthday party for Raizen, creating a memory that will last a lifetime.
            - paragraph [ref=f6e102]: What a blessing it was to spend time with these brave young warriors and their families. I came away deeply moved. It was an emotional rollercoaster — heartwarming and soul-enriching. In the face of uncertainty and tough challenges, there’s so much hope in that space.
            - paragraph
