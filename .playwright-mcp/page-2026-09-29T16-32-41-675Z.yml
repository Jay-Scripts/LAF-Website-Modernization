                  - /url: https://www.linkedin.com/cws/share?url=https://plus.inquirer.net/lifestyle/personal-struggle-moves-one-father-to-help-those-in-same-boat/
              - generic [ref=e240]:
                - generic [ref=e241]:
                  - paragraph [ref=e242]: Butch Bustamante describes the sequence of events leading to his setting up of a foundation to help pediatric cancer patients—one that started in 2013 when his toddler was discovered to have a low platelet count.
                  - paragraph [ref=e243]: The family was still based in New Jersey in the United States, where Bustamante held a job in supply chain management. His son Noah was only 2 at the time and was asymptomatic, so the family hoped and prayed he would eventually outgrow it. But six years later, the boy was diagnosed with aplastic anemia that his dad described as bone marrow failure.
                  - paragraph [ref=e244]: Aplastic anemia is a severe hematologic condition in which the body fails to make enough blood cells, resulting in a deficiency of all blood cell types (red blood cells, white blood cells, and platelets).
                  - figure "Butch Bustamante with son Noah. —CONTRIBUTED PHOTOS" [ref=e245]
                  - paragraph [ref=e247]: “In the Philippines, getting a diagnosis of aplastic anemia is like getting a death sentence. The only cure is a bone marrow transplant that costs P2.5 million, and you still have to find a donor that matches,” Bustamante told Lifestyle.
                  - paragraph [ref=e248]: “Fortunately we were living in the US; Noah was born there. When our doctors suggested we go for the transplant, we signed up at the bone marrow registry. They were able to locate two matching donors, and the doctors chose the 27-year-old male donor.”
                  - paragraph [ref=e249]: On May 7, 2019, Noah was admitted to the Philadelphia Children’s Hospital and underwent the transplant 10 days later. They stayed in the hospital for a month before transferring to a nearby facility, just a few minutes’ drive away.
                  - paragraph [ref=e250]
                  - heading "Full-service facility" [level=2] [ref=e251]
                  - paragraph [ref=e252]: The facility, an entire building complete with one-bedroom suites and a cafeteria open 24/7, was run by the Ronald McDonald House Charities, a nonprofit dedicated to supporting families with sick children.
                  - paragraph [ref=e253]: The Bustamantes ended up staying there for three months because it was located near the hospital. “We had to be close enough in case the transplant failed or was rejected by Noah’s system. Staying at the facility was free, but you can make a donation. It was like a five-star hotel. Shuttles departed for the hospital every 30 minutes,” Bustamante recounted.
                  - paragraph [ref=e254]: Last May, Noah marked his fifth year since the surgery—a milestone for cancer survivors. It means they’re out of the woods and only need to focus on the survivorship program. Now 13 years old and in seventh grade, Noah lives in the US with his mother, where he is exploring the thrills of teen dating.
                  - paragraph [ref=e255]: But back then, when his son was in the fight of his life, Bustamante would update family and friends about Noah’s condition on social media. Two readers with children who had the same diagnosis reached out to him. That was when he considered putting up something similar in the Philippines.
                  - paragraph [ref=e256]
                  - paragraph [ref=e257]: Bustamante decided to name it Little Ark—after his son Noah, who was named after the biblical character. He first registered Little Ark in California, and later at the Securities and Exchange Commission (SEC), as a charitable nonprofit organization when they moved back to the Philippines in 2021.
                  - paragraph [ref=e258]: “When I decided to put up the Little Ark foundation, I did so expecting things would be easy, that people would immediately flock to it and provide support. I didn’t realize it would be complex, hard, and difficult, especially here in the Philippines. Add to that the fact that we were setting it up during the pandemic.”
                  - figure "Little Ark pantry" [ref=e259]
                  - heading "Scheduled stays" [level=2] [ref=e261]
                  - paragraph [ref=e262]: He partnered with the Philippine Children’s Hospital (PCH) on E. Rodriguez in Quezon City. The hospital provides him a list of patients who can stay at Little Ark while the patient is undergoing treatment at PCH. Pediatric patients with scheduled treatments are given top priority. At the moment, there are 60 patients—most of them male—aged between 2 and 18 years old enrolled in the program. They have one of three diagnoses and are undergoing one of five treatments.
                  - paragraph [ref=e263]: Before Bustamante set up Little Ark, indigent patients from outside Metro Manila resorted to sleeping on benches in the hospital lobby or setting up makeshift cots outdoors next to a drugstore because of lack of funds for accommodations.
                  - paragraph [ref=e264]: “When people ask me how it was when Noah was sick, I tell them it was very painful for me as his father. I saw how his little body shook when he was injected with the chemo meds, and then later when his hair fell out. It was like hell, but at the time, I felt like we were surrounded by angels. That was our experience in Philadelphia,” he said.
                  - paragraph [ref=e265]: That overflow of blessings, resources, and prayers served as the impetus for the Little Ark foundation.
                  - generic [ref=e266]:
