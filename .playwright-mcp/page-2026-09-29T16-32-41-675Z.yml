                - link "" [ref=e233] [cursor=pointer]:
                  - /url: mailto:?subject=Personal%20struggle%20moves%20one%20father%20to%20help%20those%20in%20same%20boat&body=Personal%20struggle%20moves%20one%20father%20to%20help%20those%20in%20same%20boat%20https://plus.inquirer.net/lifestyle/personal-struggle-moves-one-father-to-help-those-in-same-boat/
