                  - paragraph
                  - paragraph [ref=e277]: “There was so much support from everyone, from the doctors, nurses, and social workers to the community and the staff at the Ronald McDonald facility. It was a constant struggle, but we never felt we were alone in this journey.”
                  - figure "One of two bedrooms at Little Ark" [ref=e278]
                  - heading "Four beds" [level=2] [ref=e280]
                  - paragraph [ref=e281]: The first Little Ark that opened in March 2024 was a small facility with four beds that could accommodate four patients and their parent or guardian, or a total of eight at a time. Last month, it opened a bigger facility in Sta. Mesa, Manila, with two rooms that can accommodate five patients and five parents or guardians per room. It’s equipped with a kitchen and pantry as well as a shared space where the children can do a few art-related activities led by a volunteer teacher before bedtime. There’s a bathroom where they can freshen up and a vehicle with a driver to take them to and from the PCH for treatments.
                  - paragraph [ref=e282]: “When Noah was undergoing treatment, it felt like we were given a problem, a challenge. But at the same time, God gave us the resources to go through it. That’s why I put up the foundation. I wanted to do exactly the same thing for those undergoing the same challenge we went through five years ago,” he said.
                  - paragraph [ref=e283]: Bustamante recounted that when when people would go up to him and slip their donations into his hand, they would downplay the act, describing the amount as “just a small thing.” He would always tell them that while it might seem that way for them, it was a big thing for him “because we don’t even know each other and yet you’re giving me this love and support.”
                  - paragraph [ref=e284]: While there have been groups and individuals willing to help out his fledgling foundation, sometimes supplies dwindle until they’re almost depleted.
                  - paragraph [ref=e285]:
                    - text: “One day, a parent of one of the patients came to me to say we had only one
                    - emphasis [ref=e286]: tabo
                    - text: (dipper) of uncooked rice left in the pantry. That same day, a donor dropped off five sacks of rice.”
                  - paragraph [ref=e287]: It’s things like these that make him believe in what he’s doing. “I want people whose children are sick to know that the world is not a cruel place, that there are so many good people in the world,” he said. INQ
