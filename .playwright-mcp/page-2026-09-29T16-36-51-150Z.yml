              - paragraph [ref=e375]: In a rooftop gathering that mixed soulful choral music with stirring works of art, the Little Ark Foundation raised funds in support of children undergoing treatment at the National Children’s Hospital.
              - paragraph [ref=e376]: The June 29 fundraiser, held at the VCP Building along Kalayaan Avenue, brought together donors, artists, and advocates for an afternoon of compassion. With a limited raffle featuring original and limited-edition works by celebrated Filipino artists and a performance by award-winning choir Novo Concertante Manila, the event spotlighted the healing power of art and music.
