              - figure "Anton del Castillo’s Adam and Eve becomes one of the featured raffle prizes supporting pediatric patients through the Little Ark Foundation" [ref=e388]
              - figure "Jose Santos III’s ‘Untitled (Construction)’ piece is raffled off to raise funds for children undergoing treatment at the National Children’s Hospital" [ref=e390]
              - figure "Guests view Pete Jimenez’s steel piece Kurot sa Puso, one of the artworks raffled during the Little Ark Foundation’s fundraising event" [ref=e392]
              - paragraph [ref=e394]: That journey led to the creation of Little Ark, which supports families of pediatric patients, many of whom travel from the provinces for treatment and have no place to stay. The foundation provides non-medical, holistic support services to help children with blood diseases and cancer complete their treatment plans.
              - paragraph [ref=e395]: “One of the highlights of the day is our art raffle,” Bustamante said, acknowledging the artists and donors who contributed works by Joven Alcala, Benjie Cabangis, Pete Jimenez, Juvenal Sansó, Toym Imao, and Rodel Tapaya, among others. The initiative helps raise awareness and sustain support for children undergoing intensive care.
              - figure "The Novo Concertante Manila choir performs moving choral pieces during the fundraiser" [ref=e396]
              - paragraph [ref=e398]: All proceeds from the raffle went toward the foundation’s programs, including a halfway house currently under renovation near the hospital.
              - paragraph [ref=e399]: "Among the major winners were Christine Valencia-Batara, who took home Blue Bloom by Joven Alcala; Mico Manalo, who won Pete Jimenez’s steel piece Kurot sa Puso; and Joe Tsui, who claimed Mangrove Series #9 by Benjie Cabangis. Artist Pete Jimenez also won a piece himself, Summer Rain #1 by Cabangis, while Emma Dizon received Rodel Tapaya’s Daydreaming."
              - paragraph [ref=e400]: Also raffled off were works by Juvenal Sansó, including A Universe of Things won by Luisa Schwartz, and Of Impalpable Beauty claimed by Manny Chan. Notably, Ricky Francisco won Adam and Eve by Anton del Castillo, and Jimenez also took home Jose Santos III’s untitled construction piece.
              - paragraph [ref=e401]: Hema-Onco division chief Dr. Ana Marie Espaldon of the National Children’s Hospital described how the halfway house will meet a vital need.
              - paragraph [ref=e402]: “Before, we saw families sleeping in hospital corridors, waiting for the next round of treatment,” she said. “This house is not just a building. It’s a bridge between healing and hardship.”
              - paragraph [ref=e403]: Quezon City administrator Michael Victor Alimurung, who attended the event, praised the foundation’s work.
              - paragraph [ref=e404]: “Government can only do so much,” he said. “That’s why we’re grateful for groups like the Little Ark Foundation who go beyond and really work to help others.”
              - paragraph [ref=e405]: As the event wrapped up, Bustamante reminded the crowd of the cause at the heart of it all.
              - paragraph [ref=e406]: “A warm meal, a safe place to sleep, a ride to the hospital—these small things become everything,” he said. “You don’t need to have all the answers. Just show up.”
              - paragraph [ref=e407]: Meanwhile, the 8th Entertainment Editors’ Choice (The Eddys) has named the Little Ark Foundation as its official beneficiary.
              - paragraph [ref=e408]: Organized by the Society of Philippine Entertainment Editors (SPEEd), The Eddys honors achievements in Philippine cinema. Part of the event’s proceeds will go to the foundation’s programs.
              - paragraph [ref=e409]: “This year, The EDDYS goes beyond recognizing cinematic excellence by standing with children who are bravely fighting for their lives,” said SPEEd president Salve Asis.
              - paragraph [ref=e410]: The awards night is set for July 20 at the Marriott Ballroom in Newport World Resorts, Pasay City. It will air via delayed telecast on the Kapamilya Channel and Jeepney TV and stream on iWantTFC on July 27.
